[package]
name         = "claude-smart"
version      = "0.4.3"
edition      = "2024"
rust-version = "1.95"  # floor set by sysinfo 0.39.6's MSRV (highest among current deps)
default-run  = "csm"
description  = "Cross-platform Claude Code smart session manager"
license      = "BSD-3-Clause"
repository   = "https://github.com/DaveDev42/claude-smart"
homepage     = "https://github.com/DaveDev42/claude-smart"
keywords     = ["claude", "ai", "cli", "session"]
categories   = ["command-line-utilities"]
readme       = "README.md"
# Keep the published crate tarball free of CI config, the in-repo Claude Code
# harness, the e2e test harness, and release-please plumbing. .github/ is
# release plumbing; CLAUDE.md + .claude/ are editor-agent memory/config; e2e/
# is a shell+C integration harness with no build value to a registry consumer;
# release-please-config.json + the manifest drive the release PR — none mean
# anything to a registry consumer or belong in the artifact.
exclude      = [
    ".github/",
    "CLAUDE.md",
    ".claude/",
    "e2e/",
    "tools/",
    "release-please-config.json",
    ".release-please-manifest.json",
]

# `e2e` builds the sandbox binary e2e/run.sh drives (src/e2e.rs): a fake
# Keychain, a sandbox-only process table, an injectable Orca version and the
# store-write points. Never enabled for a release or a registry build.
[features]
e2e = []

[[bin]]
name = "csm"
path = "src/main.rs"

# Test-only stand-in for `claude`, driven by the pty relay integration tests
# (tests/pty_relay.rs) through CLAUDE_SMART_CLAUDE_BIN, the same override csm's
# own launch-command resolver reads. A no-op on non-unix so `cargo build --all-targets`
# / clippy stay green on windows-gnu even though the relay itself is unix-only.
[[bin]]
name = "fake_claude_relay"
path = "tests/bin/fake_claude_relay.rs"

# Test-only stand-in for claude's screen, driven by tests/idle_compact_relay.rs:
# replays the captured fixtures in tests/fixtures/screens/ and records what the
# idle-compact supervisor types at it. Also drives tests/idle_compact_conpty.rs
# on Windows.
[[bin]]
name = "fake_claude_ui"
path = "tests/bin/fake_claude_ui.rs"

# Test-only "shell" process for the same integration tests: becomes the
# session leader of a pty slave, then hands it to the real program as a
# genuine job-control child (own process group, this harness staying alive as
# its "shell" — a real, non-orphaned job, unlike an exec-in-place hop).
# See tests/bin/pty_harness.rs for why this has to be a separate OS process
# rather than something a #[test] function does to itself, and for why it
# forks a real child instead of exec'ing in place.
[[bin]]
name = "pty_harness"
path = "tests/bin/pty_harness.rs"

# Test-only Windows counterpart of pty_harness: hosts csm in a pseudoconsole
# the test drives (tests/idle_compact_conpty.rs). A no-op off Windows.
[[bin]]
name = "conpty_harness"
path = "tests/bin/conpty_harness.rs"

# ─── core, always present ────────────────────────────────────────────────────
[dependencies]
# relay screen model: parses claude's pty output so src/screen_check.rs can
# read the input box, vim mode indicator and compaction state (tracks the dim
# attribute through Cell::dim()); pure, no I/O of its own.
vt100 = "0.16"
# serde model: sidecar/<sid>.json, .relaunch sentinel, .usage-cache.json,
# profiles.json, hook stdin contract, scan index storage
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

# completions ONLY (csm completions {zsh|bash|pwsh}); never touches csm's own argv
clap          = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# human timestamps (MM-DD HH:MM), reset-epoch parse ("Jun 4 at 9pm (Asia/Seoul)"),
# stale-age annotation for the account picker when usage data is stale or unfetchable
chrono    = { version = "0.4", features = ["serde"] }
# IANA zone table: account/reset.rs's resets_to_epoch_at parser (compat payloads) and
# usage/local/display.rs's reset formatting (always active). ~3 MB binary overhead, acceptable.
chrono-tz = "0.10"

uuid = { version = "1", features = ["v4"] }   # newuuid: lowercase UUID v4
dirs = "7"                                     # cross-platform ~/ resolution for Paths

# liveness check on every target (replaces the external POSIX `ps -o comm=` spawn).
# Only TARGETED refresh_process(Pid) — never a full sweep on the hot Stop path.
# Targeted single-pid refresh on the hot Stop path (never a full sweep) plus the
# reaper's one off-path table sweep. Only `system` is needed; disk / network /
# component / user stay off.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

anyhow    = "1"   # bin error propagation
thiserror = "2"   # library-style errors in session/account/usage (UsageError, FetchError, SidecarError…)

# In-process fuzzy picker (replaces the external `fzf` shell-out). nucleo-matcher
# is the standalone scoring core of helix's nucleo (pure Rust, no worker threads);
# crossterm draws the list + reads keys on the controlling terminal — its tty_fd()
# falls back to /dev/tty (CONIN$/CONOUT$ on Windows) when stdin/stdout are piped,
# so the picker behaves like fzf even with redirected stdio. No ratatui: we render
# the small bounded list ourselves.
nucleo-matcher = "0.3"
crossterm      = "0.29"

# ─── local usage collection (src/usage/local/) ────────────────────────────────
# derive the macOS Keychain service name Claude Code itself uses:
# "Claude Code-credentials-" + sha256(NFC(config_dir)).hex[..8]
sha2 = "0.11"
# NFC-normalize the config-dir string before hashing (creds::service_name) —
# Claude Code hashes the NFC form, so a path with combining-character
# sequences must match byte-for-byte or the derived service name misses.
unicode-normalization = "0.1"
# resolve this machine's local IANA zone for display::format_resets's
# "Sep 3 at 8:59pm (Asia/Seoul)" rendering (also pulled in transitively via
# chrono-tz, but local/display.rs calls this crate directly).
iana-time-zone = "0.1"

# Process-wide allocator (`#[global_allocator]` in src/main.rs). mimalloc builds
# on all four release targets, including x86_64-pc-windows-msvc, where
# tikv-jemallocator does not build at all.
mimalloc = "0.1"

# Crypto provider for reqwest's rustls stack: ring, installed once in
# usage::local::api::http_client.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# ─── HTTP transport (local usage collection: Anthropic's OAuth usage API) ────
# rustls (not native-tls): native-tls drags in system OpenSSL on Linux, which
# breaks cross-compile. `rustls-no-provider` keeps reqwest off its aws-lc-rs
# default (a C/cmake toolchain on every release target); csm installs the
# pure-Rust ring provider itself in usage::local::api::http_client. Server
# certificates are checked against the OS trust store (rustls-platform-verifier),
# reqwest 0.13's default.
[dependencies.reqwest]
version          = "0.13"
default-features = false
features         = ["blocking", "rustls-no-provider"]

# ─── POSIX-only ──────────────────────────────────────────────────────────────
# tcsetpgrp/setpgid (foreground supervisor), kill() (hook SIGTERM), isatty (TTY gate)
# "term" also covers nix's pty (openpty/posix_openpt/ptsname) and termios modules,
# used by the pty relay launcher (platform/relay/); no separate "pty" feature exists
# in this nix version. "poll" adds nix::poll for the relay's self-pipe shutdown
# (input/output threads block in poll() so run_foreground can wake and join them
# between relaunch hops, instead of leaving a stale thread racing the next hop's
# reader on the same stdin/master fd).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["hostname", "process", "signal", "term", "fs", "user", "poll"] }
# TIOCSCTTY/TIOCGWINSZ/TIOCSWINSZ: "bad" (hardcoded, non-composable) ioctls with no
# nix wrapper, called directly the same way nix's own pty.rs calls libc (platform/relay/).
libc = "0.2"

# ─── Windows-only ────────────────────────────────────────────────────────────
# GenerateConsoleCtrlEvent, SetConsoleCtrlHandler, WaitFor*Object, CreateProcess
# (CREATE_NEW_PROCESS_GROUP), TerminateProcess, SendMessageTimeout+WM_SETTINGCHANGE
# (cas -g HKCU\Environment broadcast)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Threading",        # CreateProcess*, WaitForSingleObject, TerminateProcess, OpenProcess
    "Win32_System_Console",          # GenerateConsoleCtrlEvent, SetConsoleCtrlHandler
    "Win32_Foundation",              # TRUE/FALSE, HANDLE, HWND, LRESULT (BOOL moved to windows_sys::core)
    "Win32_UI_WindowsAndMessaging",  # SendMessageTimeout, WM_SETTINGCHANGE, HWND_BROADCAST
    "Win32_System_Registry",         # RegOpenKeyExW, RegSetValueExW (HKCU\Environment)
    "Win32_System_SystemInformation", # GetComputerNameExW (statusline host)
    "Win32_Storage_FileSystem",      # GetFileInformationByHandle (migrate: hard-link compat check)
    "Win32_System_Pipes",            # CreatePipe (ConPTY relay: pseudoconsole and helper pipes)
    "Win32_Security",                # SECURITY_ATTRIBUTES in CreatePipe/CreateProcessW signatures
] }

# ─── cargo-binstall metadata (consumed by WSL `cargo binstall claude-smart`) ──
# { repo } / { version } / { target } / { archive-suffix } / { binary-ext } are
# substituted at install time. Archive names MUST match the release packaging steps.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/csm-{ target }{ archive-suffix }"
bin-dir = "csm{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

# Fat LTO + a single codegen unit: about 20% smaller stripped binary with no
# measurable runtime change for csm's short-lived commands. The cost is a slower
# release build on every target of the release matrix.
[profile.release]
lto           = "fat"
codegen-units = 1
