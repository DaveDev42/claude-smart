[package]
name         = "claude-smart"
version      = "0.3.0"
edition      = "2021"
rust-version = "1.88"
default-run  = "csm"
description  = "Cross-platform Claude Code smart session manager"
license      = "BSD-3-Clause"
repository   = "https://github.com/DaveDev42/claude-smart"
homepage     = "https://github.com/DaveDev42/claude-smart"
keywords     = ["claude", "ai", "cli", "session"]
categories   = ["command-line-utilities"]
readme       = "README.md"
# Keep the published crate tarball free of CI config, the in-repo Claude Code
# harness, dev tracking notes, and release-please plumbing. .github/ is release
# plumbing; CLAUDE.md + .claude/ are editor-agent memory/config; TODO.md is an
# internal tracking file; release-please-config.json + the manifest drive the
# release PR — none mean anything to a registry consumer or belong in the
# artifact. (Design specs live in the private dave-environment repo, not here.)
exclude      = [
    ".github/",
    "IN_PROGRESS.md",
    "CLAUDE.md",
    ".claude/",
    "TODO.md",
    "release-please-config.json",
    ".release-please-manifest.json",
]

[[bin]]
name = "csm"
path = "src/main.rs"

# ─── core, always present ────────────────────────────────────────────────────
[dependencies]
# serde model: sidecar/<sid>.json, .relaunch sentinel, .usage-cache.json,
# profiles.json, hook stdin contract, scan index storage
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# completions ONLY (csm completions {zsh|bash|pwsh}); never touches csm's own argv
clap          = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# human timestamps (MM-DD HH:MM), reset-epoch parse ("Jun 4 at 9pm (Asia/Seoul)"),
# stale-age for the hub-down picker
chrono    = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"   # IANA zone table for resets_to_epoch (~3 MB binary overhead, acceptable)

uuid = { version = "1", features = ["v4"] }   # newuuid: lowercase UUID v4
dirs = "5"                                     # cross-platform ~/ resolution for Paths

# liveness check on every target (replaces the external POSIX `ps -o comm=` spawn).
# Only TARGETED refresh_process(Pid) — never a full sweep on the hot Stop path.
sysinfo = { version = "0.30", default-features = false }  # no "process" feature in 0.30; process APIs always present

anyhow    = "1"   # bin error propagation
thiserror = "1"   # library-style errors in session/account/usage (UsageError, FetchError, SidecarError…)

# In-process fuzzy picker (replaces the external `fzf` shell-out). nucleo-matcher
# is the standalone scoring core of helix's nucleo (pure Rust, no worker threads);
# crossterm draws the list + reads keys on the controlling terminal — its tty_fd()
# falls back to /dev/tty (CONIN$/CONOUT$ on Windows) when stdin/stdout are piped,
# so the picker behaves like fzf even with redirected stdio. No ratatui: we render
# the small bounded list ourselves.
nucleo-matcher = "0.3"
crossterm      = "0.28"

# ─── local usage collection (src/usage/local/) ────────────────────────────────
# derive the macOS Keychain service name Claude Code itself uses:
# "Claude Code-credentials-" + sha256(NFC(config_dir)).hex[..8]
sha2 = "0.10"
# NFC-normalize the config-dir string before hashing (creds::service_name) —
# Claude Code hashes the NFC form, so a path with combining-character
# sequences must match byte-for-byte or the derived service name misses.
unicode-normalization = "0.1"
# resolve this machine's local IANA zone for display::format_resets's
# "Sep 3 at 8:59pm (Asia/Seoul)" rendering (also pulled in transitively via
# chrono-tz, but local/display.rs calls this crate directly).
iana-time-zone = "0.1"

# Process-wide allocator (`#[global_allocator]` in src/main.rs). mimalloc builds
# on all four release targets, including x86_64-pc-windows-msvc, where
# tikv-jemallocator does not build at all.
mimalloc = "0.1"

# ─── HTTP transport (local usage collection: Anthropic's OAuth usage API) ────
# rustls-tls (not native-tls): native-tls drags in system OpenSSL on Linux, which
# breaks cross-compile + adds a build-time libssl dep on the WSL target; rustls is
# pure-Rust and builds cleanly on all 4 targets (darwin/linux/windows-msvc). The
# only endpoint this hits is Anthropic's own HTTPS API (api.anthropic.com), so
# rustls's bundled webpki roots are all the trust store this needs.
[dependencies.reqwest]
version          = "0.12"
default-features = false
features         = ["json", "blocking", "rustls-tls"]

# ─── POSIX-only ──────────────────────────────────────────────────────────────
# tcsetpgrp/setpgid (foreground supervisor), kill() (hook SIGTERM), isatty (TTY gate)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["hostname", "process", "signal", "term", "fs"] }

# ─── Windows-only ────────────────────────────────────────────────────────────
# GenerateConsoleCtrlEvent, SetConsoleCtrlHandler, WaitFor*Object, CreateProcess
# (CREATE_NEW_PROCESS_GROUP), TerminateProcess, SendMessageTimeout+WM_SETTINGCHANGE
# (cas -g HKCU\Environment broadcast)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Threading",        # CreateProcess*, WaitForSingleObject, TerminateProcess, OpenProcess
    "Win32_System_Console",          # GenerateConsoleCtrlEvent, SetConsoleCtrlHandler
    "Win32_Foundation",              # BOOL, HANDLE, HWND, LRESULT
    "Win32_UI_WindowsAndMessaging",  # SendMessageTimeout, WM_SETTINGCHANGE, HWND_BROADCAST
    "Win32_System_Registry",         # RegOpenKeyExW, RegSetValueExW (HKCU\Environment)
    "Win32_Storage_FileSystem",      # stop-flag presence check
    "Win32_System_SystemInformation", # GetComputerNameExW (statusline host)
] }

# ─── cargo-binstall metadata (consumed by WSL `cargo binstall claude-smart`) ──
# { repo } / { version } / { target } / { archive-suffix } / { binary-ext } are
# substituted at install time. Archive names MUST match the release packaging steps.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/csm-{ target }{ archive-suffix }"
bin-dir = "csm{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[dev-dependencies]
tempfile = "3"

# Fat LTO + a single codegen unit: about 20% smaller stripped binary with no
# measurable runtime change for csm's short-lived commands. The cost is a slower
# release build on every target of the release matrix.
[profile.release]
lto           = "fat"
codegen-units = 1
